<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — Пиона</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:#fdf2f6; color:#4a2c3a; min-height:100vh; }
  header { background:linear-gradient(135deg,#e887a8,#c94f7c); color:#fff; padding:20px; text-align:center; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px 16px; }
  .login { max-width:380px; margin:60px auto; background:#fff; border-radius:16px; padding:28px; box-shadow:0 4px 16px rgba(201,79,124,.12); }
  input { padding:10px 12px; border:1px solid #e3b6c6; border-radius:8px; font-size:16px; }
  #pass { width:100%; }
  button { padding:12px; border:none; border-radius:10px; background:linear-gradient(135deg,#e887a8,#c94f7c); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .del, .daybtn { background:#fff; color:#c94f7c; border:1px solid #e3b6c6; font-size:13px; padding:6px 12px; font-weight:500; }
  .del:hover, .daybtn:hover { background:#c94f7c; color:#fff; }
  .err { color:#d33; margin-top:10px; font-size:14px; display:none; }
  .card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 10px rgba(201,79,124,.1); margin-bottom:24px; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:10px 12px; border-bottom:1px solid #f3dbe4; text-align:left; font-size:14px; }
  th { background:#c94f7c; color:#fff; white-space:nowrap; }
  tr:last-child td { border-bottom:none; }
  td.num { white-space:nowrap; }
  .row2 { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .closedchip { display:inline-block; background:#ffe3ea; color:#c94f7c; border:1px solid #e3b6c6; border-radius:20px; padding:4px 12px; margin:4px 6px 0 0; font-size:13px; }
  h2 { color:#c94f7c; margin-bottom:12px; }
</style>
</head>
<body>
<header><h1>Пиона — панель мастера</h1></header>

<div class="wrap">
  <div class="login" id="loginBox">
    <h2>Вход в админку</h2>
    <input type="password" id="pass" placeholder="Пароль">
    <button onclick="load()">Войти</button>
    <div class="err" id="err">Неверный пароль</div>
  </div>

  <div id="dataBox" style="display:none">
    <div class="card">
      <h2>Рабочие дни</h2>
      <p style="font-size:14px;margin-bottom:6px">Выберите дату и закройте её — на сайте день пометится как «выходной».</p>
      <div class="row2">
        <input type="date" id="dayDate">
        <button class="daybtn" onclick="setDay('close')">Закрыть день</button>
        <button class="daybtn" onclick="setDay('open')">Открыть день</button>
      </div>
      <div id="closedList" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>Заявки</h2>
      <table>
        <thead><tr>
          <th>Дата подачи</th><th>Имя</th><th>Телефон</th>
          <th>Услуга</th><th>Дата визита</th><th>Время визита</th><th></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <p style="margin-top:12px;font-size:13px;color:#b98da0">Обновлено: <span id="updated"></span> · <a href="#" onclick="refresh();return false">обновить</a></p>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxIY1nhqV-kMxfnCESgLbKNpp89A2ZJyIYTU-3_WMTbnJCTFuFpfRxuQ3Uw1GqkBF2Z/exec';
const ADMIN_PASSWORD = 'piona7235';

async function load() {
  const pass = document.getElementById('pass').value;
  if (pass !== ADMIN_PASSWORD) { document.getElementById('err').style.display = 'block'; return; }
  document.getElementById('err').style.display = 'none';
  await refresh();
}

async function refresh() {
  try {
    const res = await fetch(SCRIPT_URL + '?action=get&password=' + encodeURIComponent(ADMIN_PASSWORD));
    const json = await res.json();
    if (!json.ok) { document.getElementById('err').style.display = 'block'; return; }
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dataBox').style.display = 'block';

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = (json.items || []).map(r =>
      '<tr><td class="num">' + r['подано'] + '</td><td>' + r['имя'] + '</td>' +
      '<td class="num">' + r['телефон'] + '</td><td>' + r['услуга'] + '</td>' +
      '<td class="num">' + r['визитДата'] + '</td><td class="num">' + r['визитВремя'] + '</td>' +
      '<td><button class="del" data-ts="' + r['подано'] + '" onclick="del(this)">Удалить</button></td></tr>'
    ).join('') || '<tr><td colspan="7">Пока заявок нет</td></tr>';

    const closed = json.closed || [];
    document.getElementById('closedList').innerHTML =
      (closed.length ? 'Закрытые дни: ' : 'Закрытых дней нет.') +
      closed.map(d => '<span class="closedchip">' + d + '</span>').join('');
    document.getElementById('updated').textContent = new Date().toLocaleString('ru-RU');
  } catch (err) {
    alert('Ошибка загрузки: ' + err);
  }
}

async function del(btn) {
  if (!confirm('Удалить эту заявку? Действие необратимо.')) return;
  try {
    const res = await fetch(SCRIPT_URL + '?action=delete&password=' + encodeURIComponent(ADMIN_PASSWORD) + '&ts=' + encodeURIComponent(btn.getAttribute('data-ts')));
    const json = await res.json();
    if (json.ok) await refresh(); else alert('Не удалось удалить: ' + (json.error || 'ошибка'));
  } catch (err) { alert('Ошибка удаления: ' + err); }
}

async function setDay(mode) {
  const d = document.getElementById('dayDate').value;
  if (!d) { alert('Выберите дату'); return; }
  const parts = d.split('-');
  const date = parts[2] + '.' + parts[1] + '.' + parts[0];
  const verb = mode === 'close' ? 'закрыть' : 'открыть';
  if (!confirm(verb.charAt(0).toUpperCase() + verb.slice(1) + ' день ' + date + '?')) return;
  try {
    const res = await fetch(SCRIPT_URL + '?action=closedays&password=' + encodeURIComponent(ADMIN_PASSWORD) + '&mode=' + mode + '&date=' + encodeURIComponent(date));
    const json = await res.json();
    if (json.ok) await refresh(); else alert('Ошибка: ' + (json.error || 'неизвестно'));
  } catch (err) { alert('Ошибка: ' + err); }
}

document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
</script>
</body>
</html>
